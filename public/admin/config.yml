backend:
  name: git-gateway
  branch: main

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "noticias"
    label: "Noticias"
    folder: "src/content/noticias"
    create: true
    fields:
      - {label: "Título", name: "title", widget: "string"}
      - {label: "Fecha", name: "date", widget: "datetime"}
      - {label: "Autor", name: "author", widget: "string"}
      - {label: "Imagen de portada", name: "image", widget: "image"}
      - {label: "Contenido", name: "body", widget: "markdown"}

  - name: "paginas"
    label: "Páginas Estáticas"
    files:
      - name: "nosotros"
        label: "Página Nosotros"
        file: "src/content/paginas/nosotros.md"
        fields:
          - {label: "Título", name: "title", widget: "string"}
          - {label: "Historia", name: "historia", widget: "text"}
          - {label: "Misión", name: "mision", widget: "text"}
